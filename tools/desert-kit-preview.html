<!doctype html><html><body style="margin:0">
<script type="module">
import * as THREE from '/vendor/three.js';
import { makeUpstateTrees, makeLeafTexture } from '/js/world/toolbox/vegetation/upstate-trees.js';
import { decorateTreeMaterial } from '/js/world/toolbox/packs/northern-rockies.js';
import { RockBuilder, redRockMaterial } from '/js/world/toolbox/landscape/redrock.js';

const s = new THREE.Scene(); s.background = new THREE.Color('#bcd4e8');
const cam = new THREE.PerspectiveCamera(40, 1280 / 720, .5, 4000);

const g = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: '#c8875a' })); g.rotation.x = -Math.PI / 2; s.add(g);

const P = new URLSearchParams(location.search), mode = P.get('mode') || 'kit';

  const kit = makeUpstateTrees({ desert: true });

      for (const [gg, mm] of parts) { if (!gg) continue; const m = new THREE.Mesh(gg, mm); m.position.set(x, 0, -lod * 25); s.add(m); } }); x += sp.r * 2 + 3; }); }
  for (const name of ['sage', 'sage2', 'rabbitbrush', 'redrock', 'redrock2']) { const gg = kit.understory[name]; const m = new THREE.Mesh(gg.isBufferGeometry ? gg : gg.wood, mat); m.position.set(x, 0, 8); s.add(m); x += 4; }

  if (mode === 'hoodoo') { for (let k = 0; k < 30; k++) R.hoodoo((k % 6) * 9 - 25, 0, Math.floor(k / 6) * 9 - 20, 8 + (k * 7 % 13) * 1.6, 2 + (k % 3) * .6, k + 1, H); cam.position.set(0, 14, 50); cam.lookAt(0, 8, 0); }

    const u = { x: 1, z: 0 }; for (const sd of [-1, 1]) R.arch({ o: { x: sd * 9.5, z: -10 }, u }, H, { span: 13, height: 12, thick: 5, deep: 8, foot: 1.5, seed: 62 + sd, pedestal: false });
    for (const sd of [-1, 1]) R.fin({ o: { x: sd * 27, z: -10 }, u }, H, { len: 20, h: 20, w: 9, seed: 64 + sd }); R.fin({ o: { x: 0, z: -10 }, u }, H, { len: 7, h: 19, w: 8.5, seed: 66 });
    R.arch({ o: { x: 60, z: 20 }, u: { x: 1, z: 0 } }, H, { span: 52, height: 15, thick: 2.4, deep: 3.4, foot: 3.2, seed: 71 }); cam.position.set(0, 12, 110); cam.lookAt(10, 10, 0); }
  if (mode === 'butte') { R.butte(-250, 0, H, { R: 95, H: 160, aspect: 1.25, yaw: .4, seed: 11 }); R.spire(-250 + Math.cos(.4) * 154, Math.sin(.4) * 154, H, { r: 14, h: 144, seed: 91 });
    R.butte(250, -150, H, { R: 120, H: 120, aspect: 1.6, seed: 18 }); R.spire(0, 100, H, { r: 9, h: 95, seed: 21 }); cam.position.set(0, 20, 700); cam.lookAt(0, 70, 0); }
  if (mode === 'tunnel') { const pts = []; for (let k = 0; k < 90; k++) pts.push({ x: 0, z: -k * 4 }); R.tunnel(pts, H, H, { hill: 1, galleries: [.32, .5, .68] });

  const m = R.mesh(redRockMaterial()); s.add(m); window.tris = R.tris;

</script></body></html>
