<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>bikefree · Course arches</title>
<style>html, body { margin: 0; height: 100%; background: #dfe9f2; } #view { position: fixed; inset: 0; } canvas { display: block; }</style>
</head>
<body>
<div id="view"></div>
<script type="module">
// The start and finish arches (js/world/toolbox/roadside/course-arches.js) on a plain road, for design
// renders: ?view=start|finish|back|front-start|front-finish|pair, &start=<sub>, &finish=<sub>.
// Rendered by tools/snap_arches.mjs. Drag to orbit.
import * as THREE from '../vendor/three.js';
import { buildRoute } from '../js/gpx.js';
import { makeProjection, makeRouteIndex } from '../js/world/geo.js';
import { CourseArches } from '../js/world/toolbox/roadside/course-arches.js';
import { loadRider } from '../js/world/rider.js';
import { ROAD_WIDTH } from '../js/world/pose.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'start';
// a straight, level road heading north
const points = Array.from({ length: 61 }, (_, i) => ({ lat: 45 + i * 10 / 111320, lon: 6, ele: 0 }));
const route = buildRoute({ name: 'Test road', points });
const proj = makeProjection(45.0027, 6);
const index = makeRouteIndex(route, proj);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
document.getElementById('view').append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe0ee'); scene.fog = new THREE.Fog('#cfe0ee', 120, 420);
scene.add(new THREE.HemisphereLight('#eaf3ff', '#7d8f6a', 1.35));
const sun = new THREE.DirectionalLight('#fff4e2', 2.6);
sun.position.set(-40, 70, -30); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 300 }); sun.shadow.bias = -.0004;
scene.add(sun, sun.target);

// ground, road, shoulders, centre and edge lines
const a = index.xs[0], b = index.zs[0], c = index.xs[60], d = index.zs[60];
const len = Math.hypot(c - a, d - b), yaw = Math.atan2(c - a, d - b), mid = new THREE.Vector3((a + c) / 2, 0, (b + d) / 2);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ color: '#9bb67e', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const strip = (w, y, color, off = 0, l = len + 400) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), new THREE.MeshStandardMaterial({ color, roughness: .95 }));
  m.rotation.set(-Math.PI / 2, yaw, 0, 'YXZ');   // flat, then turned to the road's heading
  m.position.copy(mid).add(new THREE.Vector3(Math.cos(yaw) * -off, y, -Math.sin(yaw) * -off)); m.receiveShadow = true; scene.add(m);
};
strip(ROAD_WIDTH + 1.6, .06, '#b6ab93');
strip(ROAD_WIDTH, .1, '#5c6067');
for (const o of [-ROAD_WIDTH / 2 + .25, ROAD_WIDTH / 2 - .25]) strip(.14, .105, '#f1f1ec', o);
for (const o of [-.12, .12]) strip(.1, .105, '#e9b93a', o);

// the arches: start 100 m along, finish 175 m
const world = { route, index, scene, terrain: { heightAt: () => 0 } };
const arches = new CourseArches(world);
arches.set({ start: { atM: 100, title: 'START', sub: q.get('start') ?? 'Avalanche Creek' }, finish: { atM: 175, title: 'FINISH', sub: q.get('finish') ?? 'Logan Pass' } });

// a rider for scale, just short of the start
const rider = await loadRider().catch(() => null);
const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)), right = new THREE.Vector3(-fwd.z, 0, fwd.x);
const at = (s, lat = 0, y = 0) => new THREE.Vector3(a, y, b).addScaledVector(fwd, s).addScaledVector(right, lat);
const riderS = view === 'finish' || view === 'front-finish' ? 168 : view === 'back' ? 106 : 93;
if (rider) {
  rider.group.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
  rider.update(at(riderS, 1.5, .12), fwd, 1.2, 0, 0);
  scene.add(rider.group);
}

const camera = new THREE.PerspectiveCamera(40, 1, .3, 2000);
const shots = {
  start: { eye: at(78, -5.5, 2.4), look: at(100, .5, 4.2) },
  finish: { eye: at(153, 5.5, 2.4), look: at(175, -.5, 4.2) },
  back: { eye: at(122, 4.5, 2.6), look: at(100, -.5, 4.2) },
  'front-start': { eye: at(80, 0, 3.6), look: at(100, 0, 3.6), fov: 34 },
  'front-finish': { eye: at(155, 0, 3.6), look: at(175, 0, 3.6), fov: 34 },
  pair: { eye: at(62, -13, 5.5), look: at(128, 0, 3.6), fov: 34 },
};
const shot = shots[view] || shots.start;
camera.fov = shot.fov || 40; camera.position.copy(shot.eye); camera.lookAt(shot.look);
sun.target.position.copy(shot.look); sun.position.copy(shot.look).add(new THREE.Vector3(-40, 70, -30));

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
// drag to orbit around the look point
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = (e.clientX - drag.x) * .005; drag = { x: e.clientX, y: e.clientY };
  const p = camera.position.clone().sub(shot.look).applyAxisAngle(new THREE.Vector3(0, 1, 0), -dx);
  camera.position.copy(shot.look).add(p); camera.lookAt(shot.look);
});
(function loop() { renderer.render(scene, camera); requestAnimationFrame(loop); })();
window.__ready = true;
</script>
</body>
</html>
