<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bikefree · building kit gallery</title>
<style>
  html, body { margin: 0; height: 100%; background: #9ec3e6; font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 8px; }
  #ui select { font: inherit; }
  #label { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 4px 10px; border-radius: 6px; }
  body.clean #ui { display: none; }
</style>
</head>
<body>
<div id="ui">
  <label>Style <select id="style"></select></label>
  <label>View <select id="view"><option>street</option><option>aerial</option><option>close</option><option>roofs</option></select></label>
  <label>Seed <select id="seed"><option>1</option><option>2</option><option>3</option></select></label>
</div>
<div id="label"></div>
<canvas id="view3d"></canvas>
<script type="module">
// The building kit gallery: a street of each regional style (presets.js) on flat-ish ground, drawn by the
// real kit (recipes, facade shader, parts and dressing) with the gentle cartoon look, so variety and detail
// can be judged up close. Headless: npm run gallery:buildings (tools/snap_buildings.mjs).
//   ?style=<preset>&view=street|aerial|close|roofs&seed=1&clean=1
import * as THREE from '../vendor/three.js';
import { BuildingKit } from '../js/world/toolbox/structures/buildings/kit.js';
import { STYLE_PRESETS, resolveStyle } from '../js/world/toolbox/structures/buildings/presets.js';
import { Look } from '../js/world/toolbox/atmosphere/look.js';
import { randomSequence } from '../js/world/toolbox/core/random.js';

const q = new URLSearchParams(location.search);
if (q.get('clean') === '1') document.body.classList.add('clean');
const styles = Object.keys(STYLE_PRESETS);
const styleName = styles.includes(q.get('style')) ? q.get('style') : styles[0];
const view = q.get('view') || 'street', seed = Number(q.get('seed') || 1);
const $ = (id) => document.getElementById(id);
for (const s of styles) $('style').append(new Option(s, s, false, s === styleName));
$('view').value = view; $('seed').value = String(seed);
for (const id of ['style', 'view', 'seed']) $(id).addEventListener('change', () => { const u = new URL(location.href); u.searchParams.set(id, $(id).value); location.assign(u.href); });

const canvas = $('view3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9ec3e6');
scene.fog = new THREE.Fog('#b7d2ea', 260, 900);
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, .3, 3000);

// a street: the road along +x at z = 0; ground rising gently away from it on the far side
const rand = randomSequence(seed * 7717 + 3);
const heightAt = (x, z) => (z < 0 ? -z * .035 : z * .06) + Math.sin(x * .013) * .6;
const pts = (cx, cz, w, d, yaw, shape) => {
  // w along the road, d back from it; shapes: rect, L, T
  let P;
  if (shape === 'L') P = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d * .1], [w * .05, d * .1], [w * .05, d / 2], [-w / 2, d / 2]];
  else if (shape === 'T') P = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, -d * .05], [w * .18, -d * .05], [w * .18, d / 2], [-w * .18, d / 2], [-w * .18, -d * .05], [-w / 2, -d * .05]];
  else P = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]];
  const c = Math.cos(yaw), s = Math.sin(yaw);
  return P.map(([x, z]) => [cx + x * c - z * s, cz + x * s + z * c]);
};
const buildings = [];
const resort = styleName === 'ski-resort', rows = resolveStyle({ preset: styleName }).attached;
for (const side of [-1, 1]) {
  let x = -150, inRow = 0;
  while (rows && x < 150) {
    // row houses: narrow deep lots wall to wall, an alley every few houses
    const w = 5 + rand() * 1.8, d = 11 + rand() * 4, setback = 4 + d / 2;
    const cx = x + w / 2, cz = side * setback;
    const P = pts(cx, cz, w, d, 0, 'rect');
    buildings.push({ x: cx, z: cz, pts: P, levels: 0, kind: 'rowhouse', roof: -1, height: rand() < .3 ? 12 : 9, s: cx + 1000, r: Math.hypot(w, d) / 2, name: '' });
    x += w; inRow++;
    if (inRow > 5 + rand() * 5) { x += 3 + rand() * 3; inRow = 0; }
  }
  while (!rows && x < 150) {
    const r = rand();
    // a mix of sizes: sheds, houses, big farms, the odd block
    const area = r < .14 ? 14 + rand() * 12 : r < .62 ? 55 + rand() * 90 : r < .88 ? 140 + rand() * 200 : resort ? 300 + rand() * 400 : 180 + rand() * 260;
    const aspect = 1.1 + rand() * (area > 140 ? 1.3 : .6);
    const w = Math.sqrt(area * aspect), d = area / w;
    const shape = area > 120 && rand() < .3 ? (rand() < .6 ? 'L' : 'T') : 'rect';
    const setback = 7 + rand() * 6 + d / 2;
    const cx = x + w / 2, cz = side * (setback);
    const P = pts(cx, cz, w, d, (rand() - .5) * .12, shape);
    if (side > 0) P.reverse();
    let rr = 0; for (const [px, pz] of P) rr = Math.max(rr, Math.hypot(px - cx, pz - cz));
    const kind = buildings.length === 9 && !resort ? 4 : 0;   // a church in each street
    buildings.push({ x: cx, z: cz, pts: P, levels: 0, kind: ['house', 'farm', 'barn', 'shed', 'church'][kind], roof: -1, height: 0, s: cx + 1000, r: rr, name: '' });
    x += w + 4 + rand() * 8;
  }
}
// the route index the kit expects: a road every 2 m along x
const xs = [], zs = [];
for (let x = -400; x <= 400; x += 2) { xs.push(x); zs.push(0); }
const index = { xs, zs, nearest: (x, z, maxR) => { const d = Math.abs(z); if (d > maxR) return null; const i = Math.round((Math.max(-400, Math.min(400, x)) + 400) / 2); return { d, i, ele: 0 }; } };
const config = { seed, buildingKit: { detailM: 400, dressingM: 400, reachM: 1e5, detailReachM: 1e5, styles: [{ preset: styleName }] } };
const uniforms = { uSunDir: { value: new THREE.Vector3(.45, .78, .42).normalize() } };
const kit = new BuildingKit(scene, { buildings }, { heightAt }, config, uniforms, index);

// ground and road
const gGeo = new THREE.PlaneGeometry(1600, 1600, 160, 160); gGeo.rotateX(-Math.PI / 2);
const gp = gGeo.attributes.position; for (let i = 0; i < gp.count; i++) gp.setY(i, heightAt(gp.getX(i), gp.getZ(i)) - .05);
gGeo.computeVertexNormals();
const ground = new THREE.Mesh(gGeo, new THREE.MeshStandardMaterial({ color: '#7d9a52', roughness: 1 })); ground.receiveShadow = true; scene.add(ground);
const rGeo = new THREE.PlaneGeometry(800, 7, 200, 2); rGeo.rotateX(-Math.PI / 2);
const rp = rGeo.attributes.position; for (let i = 0; i < rp.count; i++) rp.setY(i, heightAt(rp.getX(i), rp.getZ(i)) + .02);
const road = new THREE.Mesh(rGeo, new THREE.MeshStandardMaterial({ color: '#666b70', roughness: .95 })); road.receiveShadow = true; scene.add(road);

// light, and the gentle cartoon look on top (as on the routes)
const sun = new THREE.DirectionalLight('#fff4e0', 3.1); sun.position.copy(uniforms.uSunDir.value).multiplyScalar(300); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -180, right: 180, top: 180, bottom: -180, near: 10, far: 900 }); sun.shadow.bias = -.0004;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight('#cfe3ff', '#6d7a52', 1.1); scene.add(hemi);
const fakeWorld = { renderer, scene, sun, hemi, sunDir: uniforms.uSunDir.value, route: { scene: {} } };
const look = new Look(fakeWorld, 'gentle'); look.applyLight(); look.sweep();

// views
if (view === 'aerial') { camera.position.set(-60, 70, 95); camera.lookAt(20, 0, 0); }
else if (view === 'close') { camera.position.set(-18, 2.6, -1.5); camera.lookAt(10, 3.5, 6); }
else if (view === 'roofs') { camera.position.set(-30, 32, -40); camera.lookAt(10, 4, 10); }
else { camera.position.set(-75, 2.8, 1.2); camera.lookAt(10, 3.2, 0); }
kit.cull(camera.position.x, camera.position.z);   // builds the near detail (dressing, canopies, gutters)
renderer.render(scene, camera);
const s = kit.stats;
$('label').textContent = `${styleName} · ${view} · ${s.buildings} buildings · ${(s.tris / 1000).toFixed(0)}k + ${(s.detailTris / 1000).toFixed(0)}k tris · ${Object.entries(s.archetypes).map(([k, v]) => `${k} ${v}`).join(', ')}`;
window.__stats = { style: styleName, view, ...s, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
window.__ready = true;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.render(scene, camera); });
</script>
</body>
</html>
