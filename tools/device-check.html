<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>bikefree device check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font:13px/1.4 -apple-system,system-ui,sans-serif}
  #v{position:absolute;inset:0}#v canvas{width:100%;height:100%;display:block}
  #out{position:absolute;left:8px;top:8px;z-index:9;background:#000b;padding:10px;border-radius:8px;white-space:pre-wrap;max-width:min(92vw,520px);max-height:88%;overflow:auto}
  button{font:inherit;padding:6px 12px;margin:6px 6px 0 0}
</style></head>
<body><div id="v"></div><div id="out">device check — building the world…</div>
<script type="importmap">{ "imports": { "three": "../vendor/three.js", "three-mesh-bvh": "../node_modules/three-mesh-bvh/src/index.js" } }</script>
<script type="module">
// The device check (fidelity plan, step 2's heat soak; Out West's real-device pass): a graph map ridden for real — the
// world's own loop, the rider moving at 30 km/h along its free ride — for `min` minutes at a quality level, sampling
// every 30 s: frames per second, the GPU's own frame time (timer queries, where the browser has them), the
// governor's level and resolution scale, draw calls, triangles and the JS heap. A device that heats up shows it as
// the fps sagging, the GPU time climbing and the governor stepping down over the minutes.
//   ?map=outwest  (any id in routes/cities: pgh, cny, skan, nyc, outwest)   &quality=balanced|high|low   &min=10
//   &lat=..&lon=..  a start spot (default: Out West's tunnel approach)        &time=golden
// Results: on screen, window.checkResult (JSON) and a Copy button — paste them back into the chat.
import { graphNetwork, nearestEdge } from '../js/graph.js';
import { loadNetwork, makePathRoute } from '../js/network.js';
import { GraphWorld } from '../js/world/graph-world.js';
const q = new URLSearchParams(location.search), out = document.getElementById('out');
const map = q.get('map') || 'outwest', quality = q.get('quality') || 'balanced', minutes = +(q.get('min') || 10);
const START = { outwest: [37.20403, -112.68457], pgh: [40.4413, -80.0005] };
const json = await (await fetch(`../routes/cities/${map}.json`)).json();
const { base, network, graph } = graphNetwork(json);
let first = network.freeRide.first;
const s0 = q.has('lat') ? [+q.get('lat'), +q.get('lon')] : START[map];
if (s0) { const at = nearestEdge(graph, s0[0], s0[1]); first = at.e.id + '+'; }
const route = makePathRoute(loadNetwork(network, base), { id: 'check', name: map, path: null, first });
const world = new GraphWorld(document.getElementById('v'), base, { path: route.netRide, quality, log: () => {} });
world.setTimeOfDay(q.get('time') || 'golden');
let pos = 40, last = performance.now();
const speed = 30 / 3.6;
world.setSource(() => ({ pos, speed, cadence: 85, riding: true }));
world.p = pos; window.bfWorld = world;
world.setPreload(true); world.start();
const t0 = performance.now();
while (!world.readiness().ready) await new Promise((r) => setTimeout(r, 500));
world.setPreload(false);
const loadS = (performance.now() - t0) / 1000;
const samples = [], ua = navigator.userAgent;
let frames = 0, since = performance.now();
const tick = () => { const now = performance.now(); pos += speed * (now - last) / 1000; last = now; frames++; requestAnimationFrame(tick); };
requestAnimationFrame(tick);
const sample = () => {
  const now = performance.now(), i = world.renderer.info.render;
  samples.push({ min: +((now - t0) / 60000).toFixed(1), fps: +(frames / ((now - since) / 1000)).toFixed(1), gpuMs: world.gpuTimer?.ms?.frame != null ? +world.gpuTimer.ms.frame.toFixed(2) : null,
    gov: world.governor?.level ?? null, scale: world.governor?.scale ?? null, calls: i.calls, tris: i.triangles, heapMB: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1e6) : null, km: +(pos / 1000).toFixed(2) });
  frames = 0; since = now;
  const r = window.checkResult = { map, quality, minutes, loadS: +loadS.toFixed(1), ua, samples,
    verdict: samples.length < 4 ? 'running' : (() => { const a = samples.slice(1, 3), b = samples.slice(-2), f = (s) => s.reduce((x, y) => x + y.fps, 0) / s.length; return `fps ${f(a).toFixed(0)} → ${f(b).toFixed(0)} (${((f(b) / f(a) - 1) * 100).toFixed(0)} %), governor ${samples.at(-1).gov}`; })() };
  out.textContent = `device check · ${map} · ${quality} · ${minutes} min\nloaded in ${r.loadS} s\n` + samples.map((s) => `${s.min.toFixed(1)} min  ${s.fps} fps  gpu ${s.gpuMs ?? '—'} ms  gov ${s.gov}  ${s.calls} calls  ${(s.tris / 1e6).toFixed(2)} M  heap ${s.heapMB ?? '—'} MB`).join('\n') + `\n\n${r.verdict}`;
  if ((now - t0) / 60000 >= minutes + loadS / 60) { out.textContent += '\n\ndone — copy the results'; return; }
  setTimeout(sample, 30000);
};
setTimeout(sample, 30000);
const b = document.createElement('button'); b.textContent = 'Copy results';
b.onclick = () => navigator.clipboard.writeText(JSON.stringify(window.checkResult || {}, null, 1)); out.after(b); b.style.cssText = 'position:absolute;right:8px;top:8px;z-index:10';
</script></body></html>
