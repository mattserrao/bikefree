<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PGH preview</title>
<style>html,body{margin:0;height:100%;background:#000}#v{position:absolute;inset:0}#v canvas{width:100%;height:100%;display:block}</style></head>
<body><div id="v"></div>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three-mesh-bvh": "../node_modules/three-mesh-bvh/src/index.js" } }</script>
<script type="module">
// A free-ride road graph's world on its own (tools/snap_pgh.mjs): ?graph=routes/cities/pgh.json&lat=..&lon=..&dir=+|-&at=<metres>&time=midday
import { graphNetwork, nearestEdge } from '../js/graph.js';
import { loadNetwork, makePathRoute } from '../js/network.js';
import { GraphWorld } from '../js/world/graph-world.js';
const q = new URLSearchParams(location.search);
if (q.has('qc')) globalThis.BF_QC = 1;   // (a QC run, tools/qc_map.mjs: the landmarks' probes on)
const json = await (await fetch('../' + (q.get('graph') || 'routes/cities/pgh.json'))).json();
const { base, network, graph } = graphNetwork(json);
let first = network.freeRide.first;
if (q.has('lat')) { const at = nearestEdge(graph, +q.get('lat'), +q.get('lon')); first = at.e.id + (q.get('dir') || '+'); }
if (q.has('edge')) first = q.get('edge');
const net = loadNetwork(network, base);
const route = makePathRoute(net, { id: 'preview', name: 'PGH', path: null, first });
const at = +(q.get('at') || 40);
const world = new GraphWorld(document.getElementById('v'), base, { path: route.netRide, quality: q.get('quality') || 'balanced', log: (a, m, l) => console.log(a, m, l || '') });
world.setTimeOfDay(q.get('time') || 'midday');
world.setCamera(q.get('camera') || 'closest');
world.setSource(() => ({ pos: at, speed: 0, cadence: 0, riding: true }));
world.p = at;
window.bfWorld = world; window.route = route;
world.setPreload(true);
world.start();
</script></body></html>
